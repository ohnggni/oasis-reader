name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets are missing"
            exit 1
          fi
          # macOS base64 output may contain line breaks; -i ignores them
          echo "$KEYSTORE_B64" | base64 -d -i > "$RUNNER_TEMP/release.jks"
          echo "OASIS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (R8, stable key)
        env:
          OASIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease -PversionCode=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            # surface Kotlin compile errors as annotations (readable without the raw log)
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -20 | sed 's/^e: /::error::/' || true
            grep -A3 'What went wrong' "$RUNNER_TEMP/build.log" | head -8 | sed 's/^/::error::/' || true
            grep -E 'FAILED|AssertionError|expected:' "$RUNNER_TEMP/build.log" | head -10 | sed 's/^/::error::/' || true
            # R8: classes a library refers to that are not on Android (add -dontwarn for them)
            M=app/build/outputs/mapping/release/missing_rules.txt
            if [ -f "$M" ]; then grep -E '^-dontwarn' "$M" | head -40 | sed 's/^/::error::R8 missing /' || true; fi
            exit 1
          }

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "DN|SHA-256"

      - name: Rename APK
        run: |
          mkdir -p out
          V="$(cat VERSION 2>/dev/null || echo 0.1).${{ github.run_number }}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "out/OasisReader-$V.apk"
          # size and what is inside, to compare builds
          ls -l "out/OasisReader-$V.apk" | awk '{printf "::notice::APK %.1f MB\n", $5/1048576}'
          unzip -l "out/OasisReader-$V.apk" | grep -E 'classes[0-9]*\.dex' | awk '{s+=$1; n++} END {printf "::notice::dex %d files, %.1f MB\n", n, s/1048576}' 

      - uses: actions/upload-artifact@v4
        with:
          name: OasisReader-${{ env.APP_VERSION }}
          path: out/*.apk
          retention-days: 30

      # every build becomes a release; "latest" always points at the newest APK:
      #   https://github.com/<repo>/releases/latest/download/OasisReader.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ env.APP_VERSION }}"
          cp "out/OasisReader-$V.apk" out/OasisReader.apk
          # release body = the top "## x.y" section of the in-app release notes;
          # falls back to the commit message when that section is empty
          awk '/^## /{n++; if(n==1){next}} n==1' app/src/main/assets/release-notes.md > out/notes.md
          if ! grep -q '[^[:space:]]' out/notes.md; then
            git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' | head -20 > out/notes.md
          fi
          gh release create "v$V" out/OasisReader.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "OG Reader $V" \
            --notes-file out/notes.md \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
